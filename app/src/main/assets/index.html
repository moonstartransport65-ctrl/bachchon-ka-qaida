<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light} html,body{margin:0} body{font-size:14px} [hidden]{display:none!important}</style>
</head>
<body>
<title>بچوں کا قاعدہ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;600&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap">
<style>
/* Layout: one notebook-style writing board with a big dotted letter, tools under it, letter strip at the bottom.
   Palette: sky paper, ink blue text, notebook line colors, one sunny action color, four crayons. */
:root{
  --bg:#EAF2FF; --surface:#FFFFFF; --ink:#16264A; --muted:#566A94; --edge:#CBD8F2;
  --line:#8FB0EA; --mid:#F0A0A8; --guide-dot:#6B82BA; --guide-fill:#EEF3FD;
  --accent:#FFC53D; --accent-ink:#2B2100; --ok:#1F8F4E; --ok-bg:#DDF4E6;
  --c0:#2447D6; --c1:#D6333D; --c2:#1E9A52; --c3:#8A3FC7;
  --p0:#E5484D; --p1:#F5871F; --p2:#FFD33D; --p3:#2FA85E; --p4:#36A9E1; --p5:#8A3FC7; --p6:#FF7EB6; --p7:#8B5A2B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1630; --surface:#172245; --ink:#EAF0FF; --muted:#9FB0D6; --edge:#2D3F72;
    --line:#3E5496; --mid:#8F4D5C; --guide-dot:#93A8DF; --guide-fill:#212F5C;
    --accent:#FFC53D; --accent-ink:#2B2100; --ok:#4FD08A; --ok-bg:#16402C;
    --c0:#7C9BFF; --c1:#FF7A82; --c2:#4FD08A; --c3:#C79BFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1630; --surface:#172245; --ink:#EAF0FF; --muted:#9FB0D6; --edge:#2D3F72;
  --line:#3E5496; --mid:#8F4D5C; --guide-dot:#93A8DF; --guide-fill:#212F5C;
  --accent:#FFC53D; --accent-ink:#2B2100; --ok:#4FD08A; --ok-bg:#16402C;
  --c0:#7C9BFF; --c1:#FF7A82; --c2:#4FD08A; --c3:#C79BFF;
  color-scheme:dark;
}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Andika','Noto Nastaliq Urdu','Noto Naskh Arabic',system-ui,sans-serif;
  font-size:17px; line-height:1.9;
  padding-top:14px; padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.app{max-width:560px; margin-inline:auto; display:grid; gap:12px}
h1{margin:0; font-size:28px; font-weight:600; line-height:1.9; text-wrap:balance}
.sub{margin:0; color:var(--muted); font-size:15px}
.top{display:grid; gap:0}
.i{width:22px; height:22px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.i.fill{fill:currentColor; stroke:none}

button{font:inherit; color:inherit}
.btn{
  min-height:56px; padding:0 18px; border-radius:16px; border:2px solid var(--edge);
  background:var(--surface); color:var(--ink); font-size:18px; line-height:1.4;
  display:inline-flex; align-items:center; justify-content:center; gap:10px; cursor:pointer;
}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:700}
.btn.small{min-height:48px; padding:0 14px; font-size:16px}
.btn:disabled{opacity:.45; cursor:default}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.crayon:focus-visible{outline:3px solid var(--ink); outline-offset:2px}

.tabs{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; direction:ltr}
.tab{
  min-height:62px; border-radius:14px; border:2px solid var(--edge); background:var(--surface);
  font-size:19px; font-weight:700; cursor:pointer; line-height:1.5;
  display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:0; padding:2px 6px;
}
.tab small{font-size:14px; font-weight:400; letter-spacing:0}
.case{display:flex; gap:8px; justify-content:center; direction:ltr}
.case button{min-width:72px; min-height:46px; border-radius:12px; border:2px solid var(--edge); background:var(--surface); font-size:22px; font-weight:700; cursor:pointer}
.case button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.case button:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--surface); border-top:2px solid var(--edge);
  padding:8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.dock .tabs{max-width:560px; margin-inline:auto}
.snd{border:2px solid var(--edge); border-radius:16px; background:var(--surface); padding:2px 14px 12px}
.snd summary{cursor:pointer; min-height:52px; display:flex; align-items:center; font-size:17px}
.snd p{margin:6px 0; font-size:15px; color:var(--muted)}
.head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.head h1{flex:1 1 200px; min-width:0}
.langsel{font:inherit; font-size:16px; min-height:46px; padding:0 10px; border-radius:12px; border:2px solid var(--edge); background:var(--surface); color:var(--ink); max-width:100%; cursor:pointer}
.langsel:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
[lang="en"]{font-family:'Andika',system-ui,sans-serif; line-height:1.5}
[lang="hi"]{font-family:'Andika','Noto Sans Devanagari','Nirmala UI',system-ui,sans-serif; line-height:1.6}
[lang="ar"],[lang="fa"],[lang="ps"],[lang="sd"]{font-family:'Andika','Noto Naskh Arabic','Noto Nastaliq Urdu',system-ui,sans-serif; line-height:1.7}
main:not([lang="ur"]) h1{line-height:1.4}
main:not([lang="ur"]) .urname{line-height:1.5}
.snd select{font:inherit; font-size:15px; max-width:100%; min-height:44px; background:var(--surface); color:var(--ink); border:2px solid var(--edge); border-radius:10px; margin-block:6px}
.snd input[type=file]{max-width:100%; font:inherit; font-size:15px; margin-block:6px}
.tab[aria-selected="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}

.board{background:var(--surface); border:2px solid var(--edge); border-radius:22px; padding:12px; display:grid; gap:10px}
.meta{display:flex; align-items:center; justify-content:space-between; gap:10px}
.say{display:flex; align-items:center; gap:10px; min-width:0}
.urname{font-size:26px; font-weight:600; line-height:1.9}
.count{color:var(--muted); font-size:15px; font-variant-numeric:tabular-nums; direction:ltr}

.pad{position:relative; width:100%; aspect-ratio:1/1; border-radius:14px; overflow:hidden; background:var(--surface); border:2px solid var(--edge)}
.pad canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
#ink{touch-action:none; cursor:crosshair}
.star{
  position:absolute; top:10px; inset-inline-start:10px; width:44px; height:44px; border-radius:50%;
  background:var(--ok-bg); color:var(--ok); display:grid; place-items:center; pointer-events:none;
}
.star .i{width:26px; height:26px}

.status{margin:0; min-height:2.2em; text-align:center; color:var(--muted); font-size:16px}
.status.ok{color:var(--ok); font-weight:600}

.tools{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.crayons{display:flex; gap:10px}
.crayon{width:44px; height:44px; border-radius:50%; border:3px solid var(--surface); box-shadow:0 0 0 2px var(--edge); cursor:pointer; padding:0}
.crayon[aria-checked="true"]{box-shadow:0 0 0 4px var(--ink)}

.nav{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.nav .btn{width:100%}
.btn.ready{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

.strip{display:flex; gap:8px; overflow-x:auto; direction:ltr; padding:4px 2px 10px}
.chip{
  flex:0 0 auto; width:48px; height:48px; border-radius:12px; border:2px solid var(--edge);
  background:var(--surface); font-size:20px; font-weight:700; cursor:pointer; position:relative; line-height:1;
}
.chip.done{background:var(--ok-bg); border-color:var(--ok)}
.chip.on{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent)}
.chip .mini{position:absolute; top:-6px; right:-6px; width:18px; height:18px; color:var(--ok)}

.pad svg.pic{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:manipulation}
.pic .f{fill:var(--surface); stroke:var(--ink); stroke-width:3.5; stroke-linejoin:round; cursor:pointer}
.pic .l{fill:none; stroke:var(--ink); stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; pointer-events:none}
.pic .cap{font-family:'Noto Naskh Arabic','Droid Arabic Naskh',serif; font-weight:700; font-size:22px; fill:var(--ink); text-anchor:middle; pointer-events:none}
.swatches{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; width:100%}
.sw{
  min-height:66px; padding:6px 2px; border-radius:14px; border:2px solid var(--edge); background:var(--surface); color:var(--ink);
  cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:14px; line-height:1.35; direction:ltr;
}
.sw .dot{width:28px; height:28px; border-radius:50%; border:2px solid var(--ink); flex:none}
.sw .ur{font-size:13px; color:var(--muted); line-height:1.5}
.sw[aria-checked="true"]{border-color:var(--ink); box-shadow:0 0 0 3px var(--accent)}
.sw.erase{grid-column:1 / -1; flex-direction:row; min-height:48px; gap:10px; direction:inherit; font-size:16px}
.sw:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.ask{
  display:flex; align-items:center; gap:12px; width:100%; min-height:68px; padding:6px 14px; border-radius:16px;
  border:2px solid var(--edge); background:var(--guide-fill); cursor:pointer; text-align:start;
}
.ask > div{min-width:0}
.askdot{width:42px; height:42px; border-radius:50%; border:3px solid var(--ink); flex:none}
.askEn{font-size:28px; font-weight:700; line-height:1.25; direction:ltr; text-align:start}
.askUr{font-size:16px; line-height:1.7; color:var(--muted)}
.ask:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.pic .f.next{stroke:var(--accent); stroke-width:8; animation:glow .9s ease-in-out infinite alternate}
@keyframes glow{from{stroke-width:4}to{stroke-width:9}}

@media (prefers-reduced-motion: reduce){ .btn.ready{animation:none} .pic .f.next{animation:none} }
.chip{font-family:'Noto Naskh Arabic','Droid Arabic Naskh',serif}
.tab span[lang="ar"]{font-family:'Noto Naskh Arabic','Droid Arabic Naskh',serif; line-height:1.6}
.askEn.formula{font-size:34px; font-weight:700; direction:ltr; font-family:'Noto Naskh Arabic','Droid Arabic Naskh',serif; line-height:1.5}
.urname{font-family:'Noto Naskh Arabic','Andika','Noto Nastaliq Urdu',serif}
.btn[hidden]{display:none!important}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" fill="none"/></symbol>
  <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><polygon points="12,2.5 14.9,8.6 21.5,9.4 16.6,14 17.9,20.6 12,17.3 6.1,20.6 7.4,14 2.5,9.4 9.1,8.6" fill="currentColor" stroke="none"/></symbol>
</svg>

<main class="app" lang="ur" dir="rtl">
  <header class="top">
    <div class="head"><h1 data-i="title">بچوں کا قاعدہ</h1><select id="lang" class="langsel" aria-label="Language"></select></div>
    <p class="sub" data-i="sub">انگلی سے نقطوں کے اوپر لکھیں</p>
  </header>

  <section class="board">
    <div class="meta">
      <div class="say">
        <button class="btn small" id="speak" type="button"><svg class="i"><use href="#i-speaker"/></svg><span data-i="listen">سنیں</span></button>
        <span class="urname" id="urname" lang="ar">الف</span>
      </div>
      <span class="count" id="count">1 / 28</span>
    </div>

    <button class="ask" id="ask" type="button" hidden aria-live="polite">
      <span class="askdot" id="askdot"></span>
      <div><div class="askEn" id="askEn" lang="ar"></div><div class="askUr" id="askUr"></div></div>
    </button>

    <div class="pad" id="pad">
      <canvas id="guide"></canvas>
      <canvas id="ink"></canvas>
      <svg id="pic" class="pic" viewBox="0 0 200 200" hidden role="img" aria-label="رنگ بھرنے کی تصویر"></svg>
      <span class="star" id="star" hidden><svg class="i fill"><use href="#i-star"/></svg></span>
    </div>

    <p class="status" id="status" aria-live="polite">انگلی سے نقطوں کے اوپر لکھیں</p>

    <div class="tools">
      <div class="crayons" id="wcrayons" role="radiogroup" aria-label="رنگ">
        <button class="crayon" role="radio" aria-checked="true" aria-label="نیلا" data-c="0" style="background:var(--c0)"></button>
        <button class="crayon" role="radio" aria-checked="false" aria-label="لال" data-c="1" style="background:var(--c1)"></button>
        <button class="crayon" role="radio" aria-checked="false" aria-label="ہرا" data-c="2" style="background:var(--c2)"></button>
        <button class="crayon" role="radio" aria-checked="false" aria-label="جامنی" data-c="3" style="background:var(--c3)"></button>
      </div>
      <div class="swatches" id="swatches" role="radiogroup" aria-label="رنگ چنیں" hidden>
        <button class="sw" role="radio" aria-checked="false" aria-label="Red" data-p="0"><span class="dot" style="background:var(--p0)"></span><span class="arn" lang="ar"></span><span class="ur" data-c="0">لال</span></button>
        <button class="sw" role="radio" aria-checked="false" aria-label="Orange" data-p="1"><span class="dot" style="background:var(--p1)"></span><span class="arn" lang="ar"></span><span class="ur" data-c="1">نارنجی</span></button>
        <button class="sw" role="radio" aria-checked="false" aria-label="Yellow" data-p="2"><span class="dot" style="background:var(--p2)"></span><span class="arn" lang="ar"></span><span class="ur" data-c="2">پیلا</span></button>
        <button class="sw" role="radio" aria-checked="false" aria-label="Green" data-p="3"><span class="dot" style="background:var(--p3)"></span><span class="arn" lang="ar"></span><span class="ur" data-c="3">ہرا</span></button>
        <button class="sw" role="radio" aria-checked="false" aria-label="Blue" data-p="4"><span class="dot" style="background:var(--p4)"></span><span class="arn" lang="ar"></span><span class="ur" data-c="4">نیلا</span></button>
        <button class="sw" role="radio" aria-checked="false" aria-label="Purple" data-p="5"><span class="dot" style="background:var(--p5)"></span><span class="arn" lang="ar"></span><span class="ur" data-c="5">جامنی</span></button>
        <button class="sw" role="radio" aria-checked="false" aria-label="Pink" data-p="6"><span class="dot" style="background:var(--p6)"></span><span class="arn" lang="ar"></span><span class="ur" data-c="6">گلابی</span></button>
        <button class="sw" role="radio" aria-checked="false" aria-label="Brown" data-p="7"><span class="dot" style="background:var(--p7)"></span><span class="arn" lang="ar"></span><span class="ur" data-c="7">بھورا</span></button>
        <button class="sw erase" role="radio" aria-checked="false" aria-label="رنگ ہٹائیں" data-p="-1"><svg class="i"><use href="#i-eraser"/></svg><span data-i="erase">رنگ ہٹائیں</span></button>
      </div>
      <button class="btn" id="clear" type="button"><svg class="i"><use href="#i-eraser"/></svg><span data-i="clear">صاف کریں</span></button>
    </div>
  </section>

  <nav class="nav" aria-label="حرف بدلیں">
    <button class="btn" id="prev" type="button"><svg class="i"><use href="#i-right"/></svg><span data-i="prev">پچھلا</span></button>
    <button class="btn primary" id="next" type="button"><span data-i="next">اگلا</span><svg class="i"><use href="#i-left"/></svg></button>
  </nav>

  <div class="strip" id="strip" aria-label="سارے حرف"></div>

  <details class="snd">
    <summary data-i="mp3sum">آواز (MP3) شامل کریں</summary>
    <p data-i="mp3help"></p>
    <input type="file" id="mp3" accept="audio/*" multiple>
    <p id="clipinfo">ابھی کوئی MP3 شامل نہیں</p>
    <button class="btn small" id="mp3clear" type="button" data-i="clearclips">سب آوازیں ہٹائیں</button>
    <p data-i="ifnosound">اگر آواز نہ آئے تو یہ بٹن دبا کر دیکھیں:</p>
    <button class="btn small" id="vtest" type="button" data-i="vtest">آواز کی جانچ</button>
    <p id="vinfo"></p>
    <button class="btn small" id="vinstall" type="button" data-i="vinstall">عربی آواز انسٹال کریں</button>
  </details>
</main>

<div class="dock" lang="ur" dir="rtl">
  <div class="tabs" role="tablist" aria-label="نیچے کے ٹیب">
    <button class="tab" role="tab" data-kind="L" aria-selected="true"><span lang="ar">ا ب ت</span><small data-i="t_letters">حروف</small></button>
    <button class="tab" role="tab" data-kind="S" aria-selected="false"><span lang="ar">با تا</span><small data-i="t_combo">ملاپ</small></button>
    <button class="tab" role="tab" data-kind="N" aria-selected="false"><span lang="ar">١٢٣</span><small data-i="t_numbers">گنتی</small></button>
    <button class="tab" role="tab" data-kind="C" aria-selected="false"><span>&#127912;</span><small data-i="t_colour">رنگ بھریں</small></button>

  if (!masks) buildMasks();
  var t = document.createElement('canvas'); t.width = t.height = N;
  var tx = t.getContext('2d');
  tx.drawImage(inkC, 0, 0, N, N);
  var d = tx.getImageData(0,0,N,N).data;
  var coreHit = 0;
  for (var i = 0; i < N*N; i++) {
    if (d[i*4+3] > 90 && masks.core.a[i]) coreHit++;
  }
  var coverage = coreHit / Math.max(1, masks.core.n);
  if (coverage >= 0.5) {
    var firstTime = !passed;
    passed = true;
    markDone(mode, K(cur()));
    setStatus(T('good'), true);
    updateUI();
    if (firstTime) setTimeout(speak, 250);
  } else if (!passed) {
    setStatus(T('more'), false);
  }
}

/* ---- sound: parent's MP3 > files packed in the app > phone's Arabic text-to-speech ---- */
var arVoice = null;
function pickVoices(){
  if (!('speechSynthesis' in window)) return;
  var v = window.speechSynthesis.getVoices() || [];
  arVoice = v.filter(function(x){ return /^ar/i.test(x.lang); })[0] || null;
}
if ('speechSynthesis' in window) {
  pickVoices();
  window.speechSynthesis.onvoiceschanged = pickVoices;
}
var unlocked = false;
function unlockSpeech(){
  if (unlocked || !('speechSynthesis' in window)) return;
  unlocked = true;
  try { var u = new SpeechSynthesisUtterance(' '); u.volume = 0; window.speechSynthesis.speak(u); } catch(e) {}
}

/* MP3 files added by the parent, kept on this device */
var clips = {}, dbp = null, players = [null, null, null];
function idb(){
  if (dbp) return dbp;
  dbp = new Promise(function(res, rej){
    try {
      var r = indexedDB.open('qd-audio', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('clips'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    } catch(e) { rej(e); }
  });
  return dbp;
}
function idbPut(k, blob){
  return idb().then(function(db){ return new Promise(function(res, rej){
    var tx = db.transaction('clips', 'readwrite'); tx.objectStore('clips').put(blob, k);
    tx.oncomplete = res; tx.onerror = function(){ rej(tx.error); };
  }); });
}
function idbAll(){
  return idb().then(function(db){ return new Promise(function(res, rej){
    var out = {}, c = db.transaction('clips', 'readonly').objectStore('clips').openCursor();
    c.onsuccess = function(){ var cu = c.result; if (cu) { out[cu.key] = cu.value; cu.continue(); } else res(out); };
    c.onerror = function(){ rej(c.error); };
  }); });
}
function idbClear(){
  return idb().then(function(db){ return new Promise(function(res, rej){
    var tx = db.transaction('clips', 'readwrite'); tx.objectStore('clips').clear();
    tx.oncomplete = res; tx.onerror = function(){ rej(tx.error); };
  }); });
}
function clipInfo(added){
  var c = Object.keys(clips).length;
  $('clipinfo').textContent = c ? (added ? T('nclips2', c, added) : T('nclips', c)) : T('noclips');
}
idbAll().then(function(o){ clips = o; clipInfo(0); }).catch(function(){});
function playClip(key){
  var b = clips[key]; if (!b) return false;
  try {
    if (players[0]) { players[0].pause(); }
    var url = URL.createObjectURL(b), au = new Audio(url);
    au.onended = function(){ URL.revokeObjectURL(url); };
    var pr = au.play(); if (pr && pr.catch) pr.catch(function(){});
    players[0] = au; return true;
  } catch(e) { return false; }
}
/* voice files packed inside the phone app (assets/audio/L01.mp3 ...) */
var bundledOk = {};
function playBundled(key, fail){
  if (bundledOk[key] === false) { fail(); return; }
  if (players[2]) { players[2]._skip = true; try { players[2].pause(); } catch(e) {} }
  var au, finished = false;
  function bad(){ if (finished || (au && au._skip)) return; finished = true; bundledOk[key] = false; fail(); }
  try {
    au = new Audio('audio/' + key + '.mp3');
    au._skip = false;
    au.onerror = bad;
    au.onplaying = function(){ finished = true; bundledOk[key] = true; };
    players[2] = au;
    var pr = au.play(); if (pr && pr.catch) pr.catch(bad);
  } catch(e) { bad(); }
}
window.__noVoice = function(){ setStatus(T('noarvoice'), false); };
function webSay(text){
  if (!('speechSynthesis' in window)) { setStatus(T('novoice'), false); return; }
  if (!arVoice) pickVoices();
  try { window.speechSynthesis.resume(); } catch(e) {}
  setTimeout(function(){
    try {
      var u = new SpeechSynthesisUtterance(text);
      if (arVoice) { u.voice = arVoice; u.lang = arVoice.lang; } else { u.lang = 'ar-SA'; }
      u.rate = 0.7; u.pitch = 1.05;
      u.onerror = function(ev){ if (ev && ev.error !== 'canceled' && ev.error !== 'interrupted') setStatus(T('nosound'), false); };
      window.speechSynthesis.speak(u);
    } catch(e) { setStatus(T('nosound'), false); }
  }, 90);
}
function nativeSay(text){
  try { window.AndroidTTS.speak(text, 'ar-SA'); } catch(e) { setStatus(T('nosound'), false); }
}
function sayAr(text, fileKey, upKey){
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch(e) {}
  if (playClip(upKey)) return;
  if (window.AndroidTTS) { playBundled(fileKey, function(){ nativeSay(text); }); return; }
  webSay(text);
}
function speak(){
  var it = cur();
  sayAr(it.tts, it.file, it.file);
}

/* ---- interface language ---- */
var lang = 'ur';
function langInfo(){
  for (var i = 0; i < I18N.langs.length; i++) { if (I18N.langs[i].c === lang) return I18N.langs[i]; }
  return I18N.langs[0];
}
function T(key){
  var pk = I18N.ui[lang] || I18N.ui.ur, v = pk[key];
  if (v == null) v = I18N.ui.ur[key];
  if (v == null) return key;
  for (var i = 1; i < arguments.length; i++) v = v.replace('{' + (i - 1) + '}', arguments[i]);
  return v;
}
/* the name shown beside the speaker, in the chosen language */
function pick(it){
  if (lang === 'en') return it.en;
  if (lang === 'hi') return it.hi;
  if (lang === 'ur' && it.ur) return it.ur;
  return it.ar || it.ch;
}
function letterName(l){ return lang === 'en' ? l[3] : lang === 'hi' ? l[4] : lang === 'ur' ? l[2] : l[1]; }
function dispName(it){
  if (mode === 'SYL') return (lang === 'en' || lang === 'hi') ? pick(it) : it.ar;
  if (mode === 'PAINT') {
    var meaning = lang === 'en' ? it.en : lang === 'hi' ? it.hi : lang === 'ur' ? it.ur : '';
    return it.word + (meaning ? ' \u00B7 ' + meaning : '');
  }
  return pick(it);
}
function formulaNames(it){
  var b = letterByCh(it.base);
  return letterName(b) + ' + ' + letterName(ALIF) + ' = ' + ((lang === 'en' || lang === 'hi') ? pick(it) : it.ar);
}
function applyLang(){
  var li = langInfo(), rtl = li.d === 'rtl';
  ['main.app', '.dock'].forEach(function(sel){
    var el = document.querySelector(sel);
    if (el) { el.setAttribute('lang', lang); el.setAttribute('dir', li.d); }
  });
  document.title = T('title');
  document.querySelectorAll('[data-i]').forEach(function(el){ el.textContent = T(el.getAttribute('data-i')); });
  document.querySelectorAll('.sw .ur').forEach(function(el){
    el.textContent = (lang === 'ar') ? '' : cname(parseInt(el.getAttribute('data-c'), 10));
  });
  var pu = document.querySelector('#prev use'), nu = document.querySelector('#next use');
  if (pu) pu.setAttribute('href', rtl ? '#i-right' : '#i-left');
  if (nu) nu.setAttribute('href', rtl ? '#i-left' : '#i-right');
  $('lang').value = lang;
  clipInfo(0);
  $('vinfo').textContent = '';
  var pm = mode === 'PAINT';
  setStatus(passed ? T(pm ? 'picdone2' : 'good') : T(pm ? 'pickcolour' : 'sub'), passed);
  updateUI(); updateGuide();
}
function initLang(){
  var sel = $('lang');
  I18N.langs.forEach(function(l){
    var o = document.createElement('option'); o.value = l.c; o.textContent = l.n; sel.appendChild(o);
  });
  try { var sv = localStorage.getItem('qd-lang'); if (sv && I18N.ui[sv]) lang = sv; } catch(e) {}
  sel.addEventListener('change', function(){
    lang = sel.value;
    try { localStorage.setItem('qd-lang', lang); } catch(e) {}
    applyLang();
  });
  applyLang();
}

/* ---- UI ---- */
var statusEl = $('status');
function setStatus(t, ok){ statusEl.textContent = t; statusEl.className = 'status' + (ok ? ' ok' : ''); }

function buildStrip(){
  var s = $('strip'); s.innerHTML = '';
  items().forEach(function(it, i){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = it.chip || it.ch; b.dataset.i = i;
    b.setAttribute('lang', 'ar');
    b.setAttribute('aria-label', it.word || it.ch);
    b.addEventListener('click', function(){ go(i); });
    s.appendChild(b);
  });
}
function updateUI(){
  var list = items(), it = cur();
  $('urname').textContent = dispName(it);
  var n = (done[mode] || []).length;
  $('count').textContent = (idx + 1) + ' / ' + list.length + '   \u2605 ' + n;
  $('star').hidden = !isDone(mode, K(it));
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === list.length - 1;
  $('next').classList.toggle('ready', passed && idx < list.length - 1);
  var chips = $('strip').children;
  for (var i = 0; i < chips.length; i++) {
    var d = isDone(mode, K(list[i])), on = i === idx;
    chips[i].className = 'chip' + (d ? ' done' : '') + (on ? ' on' : '');
    var old = chips[i].querySelector('.mini');
    if (d && !old) {
      var sv = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      sv.setAttribute('class', 'i fill mini');
      var u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
      u.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '#i-star'); u.setAttribute('href', '#i-star');
      sv.appendChild(u); chips[i].appendChild(sv);
    }
  }
  var act = chips[idx];
  if (act && act.scrollIntoView) { try { act.scrollIntoView({inline:'center', block:'nearest'}); } catch(e) {} }
}
function loadItem(){
  strokes = []; passed = false; masks = null;
  try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(e) {}
  var pm = mode === 'PAINT';
  guide.hidden = pm; inkC.hidden = pm;
  if (pm) picEl.removeAttribute('hidden'); else picEl.setAttribute('hidden', '');
  $('wcrayons').hidden = pm; $('swatches').hidden = !pm;
  if (pm) {
    renderPic(); passed = allFilled();
    setStatus(passed ? T('picdone') : T('pickcolour'), passed);
  } else {
    drawGuide(); redrawInk();
    setStatus(T('sub'), false);
  }
  updateUI(); updateGuide();
}
function go(i){
  var list = items();
  if (i < 0 || i >= list.length) return;
  idx = i; loadItem();
}
var KINDS = {'ABC': 'L', 'SYL': 'S', '123': 'N', 'PAINT': 'C'};
var MODES = {'L': 'ABC', 'S': 'SYL', 'N': '123', 'C': 'PAINT'};
function setMode(m){
  mode = m; idx = 0;
  document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.kind === KINDS[m] ? 'true' : 'false'); });
  buildStrip(); loadItem();
}
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    var target = MODES[t.dataset.kind];
    if (mode !== target) setMode(target);
  });
});
$('prev').addEventListener('click', function(){ go(idx - 1); });
$('next').addEventListener('click', function(){ go(idx + 1); });
$('speak').addEventListener('click', function(){ unlockSpeech(); speak(); });
$('clear').addEventListener('click', function(){
  if (mode === 'PAINT') {
    paint[K(cur())] = []; savePaint(); renderPic(); passed = false;
    setStatus(T('pickcolour'), false); updateUI(); return;
  }
  strokes = []; passed = false;
  redrawInk(); setStatus(T('again'), false); updateUI();
});
document.querySelectorAll('.crayon').forEach(function(b){
  b.addEventListener('click', function(){
    color = parseInt(b.dataset.c, 10);
    document.querySelectorAll('.crayon').forEach(function(x){ x.setAttribute('aria-checked', x === b ? 'true' : 'false'); });
  });
});

/* ---- painting ---- */
var COLORS = [
  {en:'Red', ar:'أحمر'}, {en:'Orange', ar:'برتقالي'}, {en:'Yellow', ar:'أصفر'}, {en:'Green', ar:'أخضر'},
  {en:'Blue', ar:'أزرق'}, {en:'Purple', ar:'بنفسجي'}, {en:'Pink', ar:'وردي'}, {en:'Brown', ar:'بني'}
];
var paint = {};
try { paint = JSON.parse(localStorage.getItem('qd-paint') || '{}') || {}; } catch(e) { paint = {}; }
function savePaint(){ try { localStorage.setItem('qd-paint', JSON.stringify(paint)); } catch(e) {} }
var swatch = -2;
function cname(i){ return (I18N.colors[lang] || I18N.colors.ur)[i]; }
function colName(i){ return lang === 'ar' ? COLORS[i].ar : COLORS[i].ar + ' \u00B7 ' + cname(i); }
document.querySelectorAll('.sw .arn').forEach(function(el, i){ el.textContent = COLORS[i].ar; });
function speakColor(i){
  var c = COLORS[i], key = c.en.toUpperCase();
  sayAr(c.ar, 'C_' + key, key);
}
function regions(){ return picEl.querySelectorAll('.f'); }
function allFilled(){
  var arr = paint[K(cur())] || [], n = regions().length;
  for (var i = 0; i < n; i++) { if (!arr[i]) return false; }
  return n > 0;
}
function nextIdx(){
  var arr = paint[K(cur())] || [], n = regions().length;
  for (var i = 0; i < n; i++) { if (!arr[i]) return i; }
  return -1;
}
/* the banner above the board: colour to use (paint tab) or "ب + ا = با" (joining tab) */
function updateGuide(){
  var ask = $('ask');
  Array.prototype.forEach.call(regions(), function(el){ el.classList.remove('next'); });
  if (mode === 'SYL') {
    var it = cur();
    ask.hidden = false; $('askdot').hidden = true;
    $('askEn').textContent = it.base + ' + ' + 'ا' + ' = ' + it.ar;
    $('askEn').className = 'askEn formula';
    $('askUr').textContent = formulaNames(it);
    return;
  }
  $('askdot').hidden = false; $('askEn').className = 'askEn';
  if (mode !== 'PAINT') { ask.hidden = true; return; }
  var ni = nextIdx();
  if (ni < 0) { ask.hidden = true; return; }
  var ci = cur().cols[ni], c = COLORS[ci];
  ask.hidden = false;
  $('askdot').style.background = 'var(--p' + ci + ')';
  $('askEn').textContent = c.ar;
  $('askUr').textContent = T('fillline', cname(ci));
  regions()[ni].classList.add('next');
}
function renderPic(){
  var it = cur();
  picEl.innerHTML = it.svg + '<text class="cap" x="100" y="192">' + it.word + '</text>';
  var arr = paint[K(it)] || [];
  Array.prototype.forEach.call(regions(), function(el, i){
    el.setAttribute('data-i', i);
    if (arr[i]) el.style.fill = arr[i];
  });
  updateGuide();
}
picEl.addEventListener('click', function(e){
  if (mode !== 'PAINT') return;
  var el = e.target.closest ? e.target.closest('.f') : null;
  if (!el || !picEl.contains(el)) return;
  unlockSpeech();
  var it = cur(), i = parseInt(el.getAttribute('data-i'), 10);
  var arr = paint[K(it)] || (paint[K(it)] = []);
  var was = allFilled(), need = it.cols[i], filled = false;
  if (swatch === -1) {
    arr[i] = null; el.style.fill = '';
  } else if (swatch < 0) {
    setStatus(T('choosefirst', colName(need)), false);
    speakColor(need); return;
  } else if (swatch !== need) {
    setStatus(T('wrongcol', COLORS[swatch].ar, colName(need)), false);
    speakColor(need); return;
  } else {
    var col = cssVar('--p' + swatch); arr[i] = col; el.style.fill = col; filled = true;
  }
  savePaint(); updateGuide();
  if (!was && allFilled()) {
    passed = true; markDone('PAINT', K(it));
    setStatus(T('picdone2'), true);
    updateUI(); setTimeout(speak, 250);
  } else if (was && !allFilled()) {
    passed = false; setStatus(T('pickcolour'), false); updateUI();
  } else if (filled) {
    setStatus(T('rightcol', colName(swatch)), true); speakColor(swatch);
  }
});
$('ask').addEventListener('click', function(){
  unlockSpeech();
  if (mode === 'SYL') { speak(); return; }
  var ni = nextIdx(); if (ni >= 0) speakColor(cur().cols[ni]);
});
document.querySelectorAll('.sw').forEach(function(b){
  b.addEventListener('click', function(){
    swatch = parseInt(b.dataset.p, 10);
    document.querySelectorAll('.sw').forEach(function(x){ x.setAttribute('aria-checked', x === b ? 'true' : 'false'); });
    unlockSpeech();
    if (swatch >= 0) { setStatus(colName(swatch), false); speakColor(swatch); }
    else { setStatus(T('erasehint'), false); }
  });
});

/* ---- voice check ---- */
if (!window.AndroidTTS || !window.AndroidTTS.installVoice) $('vinstall').hidden = true;
$('vinstall').addEventListener('click', function(){ try { window.AndroidTTS.installVoice(); } catch(e) {} });
$('vtest').addEventListener('click', function(){
  var info = '', ready = false, text = 'مرحبا، هل تسمعني؟';
  unlockSpeech();
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch(e) {}
  if (window.AndroidTTS) {
    try { ready = !!window.AndroidTTS.available(); } catch(e) {}
    var hasAr = true;
    try { if (window.AndroidTTS.hasLang) hasAr = !!window.AndroidTTS.hasLang('ar-SA'); } catch(e) {}
    info = !ready ? T('v_phonenot') : (hasAr ? T('v_phoneready') : T('noarvoice'));
    $('vinfo').textContent = info;
    if (hasAr) nativeSay(text);
    return;
  }
  if ('speechSynthesis' in window) {
    pickVoices();
    var n = (window.speechSynthesis.getVoices() || []).length;
    info = arVoice ? T('v_found', n, arVoice.name) : T('v_nofound', n);
  } else {
    info = T('v_nosupport');
  }
  $('vinfo').textContent = info;
  if ('speechSynthesis' in window) webSay(text);
});

/* ---- MP3 files ---- */
function validKey(stem){
  return /^L(0[1-9]|1[0-9]|2[0-8])$/.test(stem) || /^S(0[1-9]|1[0-9]|2[0-7])$/.test(stem) ||
         /^W(0[1-9]|1[0-9]|2[0-6])$/.test(stem) || /^N([1-9]|[1-9][0-9]|100)$/.test(stem) ||
         /^(RED|ORANGE|YELLOW|GREEN|BLUE|PURPLE|PINK|BROWN)$/.test(stem);
}
$('mp3').addEventListener('change', function(e){
  var files = Array.prototype.slice.call(e.target.files || []), n = 0, jobs = [];
  files.forEach(function(f){
    var stem = f.name.replace(/\.[^.]+$/, '').trim().toUpperCase();
    if (!validKey(stem)) return;
    clips[stem] = f; n++;
    jobs.push(idbPut(stem, f).catch(function(){}));
  });
  Promise.all(jobs).then(function(){ clipInfo(n); });
  e.target.value = '';
});
$('mp3clear').addEventListener('click', function(){
  clips = {}; clipInfo(0);
  idbClear().catch(function(){});
});

/* ---- theme + resize ---- */
function repaint(){ lay = {}; drawGuide(); redrawInk(); }
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', repaint); } catch(e) {}
try { new MutationObserver(repaint).observe(root, {attributes:true, attributeFilter:['data-theme']}); } catch(e) {}
if (window.ResizeObserver) { new ResizeObserver(function(){ setSize(); }).observe(pad); }
else { window.addEventListener('resize', setSize); }

/* ---- start ---- */
buildStrip();
setSize();
updateUI();
initLang();
var fontReady = (document.fonts && document.fonts.load) ? document.fonts.load('700 100px "Noto Naskh Arabic"', 'بتث').catch(function(){}) : Promise.resolve();
Promise.race([fontReady, new Promise(function(r){ setTimeout(r, 2500); })]).then(function(){
  lay = {}; masks = null; drawGuide(); redrawInk();
});
})();
</script>
